      #     subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # - name: Deploy to Azure Web App
      #   uses: azure/webapps-deploy@v3
      #   with:
      #     app-name: my-staging-app   # আপনার staging app-এর নাম
      #     package: .

  deploy-prod:
    name: Deploy to production
    needs: deploy-staging
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      # নিজের repo-র কোড GitHub-এর অস্থায়ী মেশিনে আনো
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # .python-version ফাইল থেকে Python ভার্সন পড়ে install করো same lagbe na 
      # - name: Set up Python
      #   uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      #   with:
      #     python-version-file: ".python-version"

      # নির্দিষ্ট ভার্সনের uv install করো
      - name: Installing UV
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
        # uv.lock থেকে Azure-এর (pip) জন্য requirements.txt
      - name: Export requirements.txt
        run: uv export --frozen --no-dev --no-hashes -o requirements.txt
